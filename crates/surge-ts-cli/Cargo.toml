[package]
name = "surge-ts-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "surge-ts is a Rust-based TypeScript noEmit compatibility checker."
keywords = ["typescript", "type-checker", "tsc", "cli"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

# The package is `surge-ts-cli`; the installed binary is `surge`.
[[bin]]
name = "surge"
path = "src/main.rs"

# Optional global-allocator selection for the `surge` binary only. The system
# allocator is the default; at most one feature may be enabled (enforced by
# `compile_error!` guards in `src/global_alloc.rs`). Library crates must never
# declare a global allocator, so these dependencies live only in this crate.
[features]
default = []
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]
snmalloc = ["dep:snmalloc-rs"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
thiserror = "2.0.18"
# `preserve_order` keeps package.json object key order, which determines
# conditional-`exports`/`imports` priority during package resolution.
serde_json = { version = "1.0.149", features = ["preserve_order"] }
surge-ts = { version = "0.1.0", path = "../surge-ts" }
surge-ts-checker = { version = "0.1.0", path = "../surge-ts-checker" }
surge-ts-config = { version = "0.1.0", path = "../surge-ts-config" }
surge-ts-diagnostics = { version = "0.1.0", path = "../surge-ts-diagnostics" }
surge-ts-syntax = { version = "0.1.0", path = "../surge-ts-syntax" }
mimalloc = { version = "0.1.52", optional = true }
# snmalloc-rs requires cmake and a C++ toolchain at build time.
snmalloc-rs = { version = "0.7.4", optional = true }

# tikv-jemallocator does not support MSVC targets; the dependency is target-gated
# and `src/global_alloc.rs` raises an explicit compile error there instead of
# silently falling back to another allocator.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.7.0", optional = true }
