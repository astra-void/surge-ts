[package]
name = "typescript-rust-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
thiserror = "2.0.18"
# `preserve_order` keeps package.json object key order, which determines
# conditional-`exports`/`imports` priority during package resolution.
serde_json = { version = "1.0.149", features = ["preserve_order"] }
typescript-rust-checker = { version = "0.1.0", path = "../typescript-rust-checker" }
typescript-rust-config = { version = "0.1.0", path = "../typescript-rust-config" }
typescript-rust-diagnostics = { version = "0.1.0", path = "../typescript-rust-diagnostics" }
typescript-rust-syntax = { version = "0.1.0", path = "../typescript-rust-syntax" }
