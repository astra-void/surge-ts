[package]
name = "surge-ts-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "tsconfig.json parsing and file discovery for the surge-ts checker."
keywords = ["typescript", "tsconfig", "config"]
categories = ["development-tools", "config"]
readme = "README.md"

[lib]
doctest = false

[dependencies]
globset = "0.4.18"
jsonc-parser = { version = "0.32.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
walkdir = "2.5.0"
