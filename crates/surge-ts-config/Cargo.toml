[package]
name = "surge-ts-config"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
globset = "0.4.18"
jsonc-parser = { version = "0.32.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
walkdir = "2.5.0"
