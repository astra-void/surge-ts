[package]
name = "surge-ts-diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Diagnostic types and tsc-compatible message catalog for the surge-ts checker."
keywords = ["typescript", "diagnostics", "type-checker"]
categories = ["development-tools"]
readme = "README.md"

[lib]
doctest = false

[dependencies]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
surge-ts-diagnostics-codegen = { path = "../surge-ts-diagnostics-codegen" }
