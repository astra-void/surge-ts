[package]
name = "surge-ts-checker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Embeddable, tsc-compatible TypeScript type checker. The library entry point for surge-ts."
keywords = ["typescript", "type-checker", "tsc", "compiler"]
categories = ["development-tools"]
readme = "README.md"
# Internal design notes; the published crate ships code, README, and the
# generated default libs only. (Cargo always includes the `readme` file.)
exclude = ["/*.md"]

[lib]
doctest = false

[features]
default = []
mimalloc = ["dep:libmimalloc-sys"]

[dependencies]
libmimalloc-sys = { version = "0.1.49", features = ["extended"], optional = true }
oxc_allocator = "0.128.0"
surge-ts-diagnostics = { version = "0.1.0", path = "../surge-ts-diagnostics" }
surge-ts-syntax = { version = "0.1.0", path = "../surge-ts-syntax" }
surge-ts-types = { version = "0.1.0", path = "../surge-ts-types" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
