[workspace]
members = [
  "crates/surge-ts",
  "crates/surge-ts-cli",
  "crates/surge-ts-syntax",
  "crates/surge-ts-checker",
  "crates/surge-ts-diagnostics",
  "crates/surge-ts-diagnostics-codegen",
  "crates/surge-ts-types",
  "crates/surge-ts-config",
]
resolver = "2"
exclude = ["crates/surge-ts-parser"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/astra-void/surge-ts"
homepage = "https://github.com/astra-void/surge-ts"
authors = ["astra-void"]

[profile.release]
lto = "fat"
codegen-units = 1

# Vendored oxc_parser 0.128.0 so parser-fatal errors can be turned into recoverable ones. See crates/surge-ts-parser/VENDORED.md.
[patch.crates-io]
oxc_parser = { path = "crates/surge-ts-parser" }
