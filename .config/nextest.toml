[profile.default]
# Surface all failures together at the end instead of interleaving with progress.
failure-output = "immediate-final"
fail-fast = false

# Checker/oracle tests can be heavy; warn when one runs long but don't kill it.
slow-timeout = "60s"

[profile.ci]
failure-output = "immediate-final"
fail-fast = false
retries = 2
final-status-level = "slow"
# In CI a stuck test should be reaped rather than hanging the job.
slow-timeout = { period = "120s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"
