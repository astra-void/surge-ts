[profile.default]
# Show output for failed tests at the end of the run.
failure-output = "immediate-final"
fail-fast = false

# Surge's checker/oracle tests can be heavy; warn before declaring a hang.
slow-timeout = { period = "60s", terminate-after = 4 }

[profile.ci]
failure-output = "immediate-final"
fail-fast = false
retries = 2
slow-timeout = { period = "120s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"
